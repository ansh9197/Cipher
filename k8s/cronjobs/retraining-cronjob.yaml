apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-retraining
  namespace: cipher
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: retraining-job
            image: cipher/retraining-job:latest
            imagePullPolicy: IfNotPresent
            envFrom:
            - configMapRef:
                name: cipher-config
            - secretRef:
                name: cipher-secrets
            resources:
              requests:
                memory: "512Mi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "2000m"
