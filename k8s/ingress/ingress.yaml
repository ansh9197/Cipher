apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cipher-ingress
  namespace: cipher
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: cipher.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8000
      - path: /api/v1/webhooks
        pathType: Prefix
        backend:
          service:
            name: webhook-service
            port:
              number: 8000
      - path: /api/v1/predict
        pathType: Prefix
        backend:
          service:
            name: inference-service
            port:
              number: 8000
