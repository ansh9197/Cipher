global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cipher-auth'
    static_configs:
      - targets: ['cipher-auth:8000']
    metrics_path: /metrics

  - job_name: 'cipher-inference'
    static_configs:
      - targets: ['cipher-inference:8000']
    metrics_path: /metrics

  - job_name: 'cipher-analysis'
    static_configs:
      - targets: ['cipher-analysis:8000']
    metrics_path: /metrics

  - job_name: 'cipher-webhook'
    static_configs:
      - targets: ['cipher-webhook:8000']
    metrics_path: /metrics

  - job_name: 'cipher-notification'
    static_configs:
      - targets: ['cipher-notification:8000']
    metrics_path: /metrics

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
