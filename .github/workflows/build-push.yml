name: Build and Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Test auth service
        run: |
          cd services/auth-service
          pip install -r requirements.txt
          python -c "from app.core.security import hash_password, verify_password; \
            h = hash_password('test'); \
            assert verify_password('test', h); \
            print('Auth tests passed')"

      - name: Test inference service
        run: |
          cd services/inference-service
          pip install fastapi pydantic pydantic-settings python-dotenv
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app.ml.predictor import predict
          result = predict('ModuleNotFoundError: No module named requests')
          assert result['category'] == 'dependency_error'
          assert result['confidence'] > 0
          print('Inference tests passed:', result['category'])
          "

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push auth-service
        run: |
          docker build -t $ECR_REGISTRY/cipher-auth-service:${{ github.sha }} \
                       -t $ECR_REGISTRY/cipher-auth-service:latest \
                       services/auth-service/
          docker push $ECR_REGISTRY/cipher-auth-service:${{ github.sha }}
          docker push $ECR_REGISTRY/cipher-auth-service:latest

      - name: Build and push webhook-service
        run: |
          docker build -t $ECR_REGISTRY/cipher-webhook-service:${{ github.sha }} \
                       -t $ECR_REGISTRY/cipher-webhook-service:latest \
                       services/webhook-service/
          docker push $ECR_REGISTRY/cipher-webhook-service:${{ github.sha }}
          docker push $ECR_REGISTRY/cipher-webhook-service:latest

      - name: Build and push analysis-service
        run: |
          docker build -t $ECR_REGISTRY/cipher-analysis-service:${{ github.sha }} \
                       -t $ECR_REGISTRY/cipher-analysis-service:latest \
                       services/analysis-service/
          docker push $ECR_REGISTRY/cipher-analysis-service:${{ github.sha }}
          docker push $ECR_REGISTRY/cipher-analysis-service:latest

      - name: Build and push inference-service
        run: |
          docker build -t $ECR_REGISTRY/cipher-inference-service:${{ github.sha }} \
                       -t $ECR_REGISTRY/cipher-inference-service:latest \
                       services/inference-service/
          docker push $ECR_REGISTRY/cipher-inference-service:${{ github.sha }}
          docker push $ECR_REGISTRY/cipher-inference-service:latest

      - name: Build and push notification-service
        run: |
          docker build -t $ECR_REGISTRY/cipher-notification-service:${{ github.sha }} \
                       -t $ECR_REGISTRY/cipher-notification-service:latest \
                       services/notification-service/
          docker push $ECR_REGISTRY/cipher-notification-service:${{ github.sha }}
          docker push $ECR_REGISTRY/cipher-notification-service:latest

      - name: Build and push frontend
        run: |
          docker build -t $ECR_REGISTRY/cipher-frontend:${{ github.sha }} \
                       -t $ECR_REGISTRY/cipher-frontend:latest \
                       frontend/
          docker push $ECR_REGISTRY/cipher-frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/cipher-frontend:latest

      - name: Save image tags
        run: echo "${{ github.sha }}" > /tmp/image-tag.txt

      - name: Upload image tag artifact
        uses: actions/upload-artifact@v3
        with:
          name: image-tag
          path: /tmp/image-tag.txt
