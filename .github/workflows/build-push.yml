name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Test inference engine
        run: |
          cd services/inference-service
          pip install fastapi pydantic pydantic-settings python-dotenv --quiet
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app.ml.predictor import predict
          result = predict('ModuleNotFoundError: No module named requests')
          assert result['category'] == 'dependency_error'
          assert result['confidence'] > 0
          print('PASS: inference engine working, category:', result['category'])
          "

      - name: Test auth security
        run: |
          cd services/auth-service
          pip install bcrypt python-jose cryptography --quiet
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app.core.security import hash_password, verify_password
          h = hash_password('testpass123')
          assert verify_password('testpass123', h)
          assert not verify_password('wrong', h)
          print('PASS: auth security working')
          "

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push all services
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for SERVICE in auth-service webhook-service analysis-service inference-service notification-service; do
            echo "Building $SERVICE..."
            docker build \
              -t $ECR_REGISTRY/cipher/$SERVICE:$IMAGE_TAG \
              -t $ECR_REGISTRY/cipher/$SERVICE:latest \
              services/$SERVICE/
            docker push $ECR_REGISTRY/cipher/$SERVICE:$IMAGE_TAG
            docker push $ECR_REGISTRY/cipher/$SERVICE:latest
            echo "Done: $SERVICE"
          done

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/cipher/frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/cipher/frontend:latest \
            frontend/
          docker push $ECR_REGISTRY/cipher/frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/cipher/frontend:latest
